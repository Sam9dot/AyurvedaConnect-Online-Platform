<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — AyurvedaConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" /><script src="js/app.js" defer></script>
  </head>
  <body class="auth-body">
    <header class="site-header"><div class="header-inner"><a class="logo" href="index.html"><img class="logo__img" src="assets/logo.png" width="72" height="72" alt="Logo" /><span class="logo__text">AyurvedaConnect</span></a><button type="button" class="nav-toggle" aria-expanded="false" aria-controls="main-nav">Menu</button><nav id="main-nav" class="nav" aria-label="Main"><a href="index.html">Home</a><a href="wellness.html">Wellness Centres</a><a href="doctors.html">Doctors</a><a href="products.html">Products</a><a href="login.html">Login</a></nav></div></header>
    <main class="auth-main">
      <div class="auth-card">
        <div class="auth-card__decoration" aria-hidden="true">
          <span class="auth-card__leaf"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-forest)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
        </div>
        <h1 class="page-title">Welcome back</h1>
        <p class="lead">Sign in to continue your wellness journey.</p>
        <form id="login-form" class="form-stack" onsubmit="return false;">
          <div>
            <label for="user-role">I am a</label>
            <select id="user-role">
              <option value="patient">Patient / User</option>
              <option value="doctor">Doctor</option>
              <option value="seller">Product Seller</option>
              <option value="wellness">Wellness Centre</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div><label for="email">Email</label><input id="email" type="email" autocomplete="email" required /></div>
          <div><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required /></div>
          <button type="submit" class="btn btn--gold btn--block">Sign in</button>
        </form>

        <form id="otp-form" class="form-stack" style="display: none;" onsubmit="return false;">
          <p id="otp-msg" style="font-size: 0.95rem; margin-bottom: 0.5rem; color: var(--color-forest); font-weight: 500;">Email Verified. Two-Factor Authentication required.</p>
          
          <div id="otp-phone-step">
            <label for="otp-phone">Enter Mobile Number to receive OTP</label>
            <div style="display:flex; gap:0.5rem">
              <input id="otp-phone" type="tel" placeholder="e.g. 9876543210" required style="flex:1" />
              <button type="button" id="btn-send-otp" class="btn btn--outline-dark">Send OTP</button>
            </div>
            <button type="button" class="btn-back-login" class="btn btn--secondary btn--sm" style="margin-top: 0.5rem; background: transparent; border: none; text-decoration: underline; cursor: pointer; color: #4a5c4a; padding: 0;">&larr; Back to Email Login</button>
          </div>

          <div id="otp-code-step" style="display: none;">
            <label for="otp-code">Enter 6-Digit Code</label>
            <input id="otp-code" type="text" placeholder="------" pattern="\d{6}" maxlength="6" style="letter-spacing:0.5em; text-align:center; font-size:1.25rem; font-weight:600;" />
            <div style="display:flex; gap:0.5rem; margin-top: 1rem;">
              <button type="button" class="btn-back-login" class="btn btn--outline-dark" style="flex:1">Cancel</button>
              <button type="submit" id="btn-verify-otp" class="btn btn--gold" style="flex:2">Verify & Login</button>
            </div>
          </div>
        </form>

        <p class="note" style="margin-top: 1.5rem">New here? <a href="signup.html">Create an account</a></p>
      </div>
    </main>
    <footer class="site-footer"><p class="footer-copy">&copy; AyurvedaConnect</p></footer>
  </body>
</html>
